name: CI

# Runs on every push and pull request. This is the gate that catches crashes
# (like the worker IntegrityError) BEFORE they reach staging or production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Compile & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile all sources (syntax check)
        run: python -m compileall -q app

      - name: Run tests
        run: pytest -q
