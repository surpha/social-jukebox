services:
  - type: web
    name: social-jukebox
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single process on purpose: per-space engines and SSE subscribers live in memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-graceful-shutdown 5
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: SPOTIFY_LOGIN_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
